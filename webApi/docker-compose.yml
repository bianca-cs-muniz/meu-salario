services:
  postgres:
    image: postgres:16-alpine
    container_name: meu-salario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meu_salario
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_salario"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dados:
